# Fase M4 — el operador T y su puerta de contraccion. Umbrales con su porqué.

puerta:
  # 1) BENEFICIO: invertir cotas con el operador debe reducir el RMSE contra
  #    la verdad plantada en las bandas interiores (donde el retardo plantado
  #    llega a 40 min => ~0.3 m de nivel mal asignado en marea viva). Se exige
  #    recuperar al menos la mitad de ese dano — menos seria un operador que
  #    "funciona" sin morder
  min_fraccion_dano_recuperado: 0.5
  # 2) NO DANO en la boca: alli la transferencia es ~identidad por
  #    construccion; tolerancia = ruido de refit entre dos nulos (~1 cm)
  max_degradacion_boca_m: 0.015
  # 3) CONTRACCION (punto fijo): alimentar a M2a el nivel del propio operador
  #    debe devolver identidad — misma tolerancia que la fuga M3
  max_tau_residual_min: 6.0

# mundo plantado de esta puerta: SOLO fase (tau 0->40 min, alpha=1). Tras la
# puerta M2 v2, el operador T v1 corrige fase; la amplitud por banda es
# inidentificable en binario (teorema afin) y su estimacion vive en el juez
# OOS sobre NDWI continuo — se juzga al operador por lo que declara corregir
plantado:
  tau_boca_a_fondo_min: [0.0, 40.0]

# la inversion de cotas usa la maquinaria estandar (_fit_block) con los
# mismos guardas de siempre (adoptados en la epoca del prototipo, R4-safe)
min_obs: 8
min_b: 0.15
mu_puntos: 50

datos:
  store: data_v4/store/ndwi_intermareal.npz
  base: data_v4/store/lamina_base.npz
  geometria: results/m1_geometry/geometry.npz
