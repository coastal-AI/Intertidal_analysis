# Fase M2 — estimadores de la marea interior. Nada cableado: cada umbral con
# su porqué, para que el método sea explicable y citable (no una caja negra).

epoca_min: 2023          # la época con hora de paso REAL verificada vía STAC
                         # (11:21 UTC ± jitter); el cubo solo guarda la fecha
n_bandas: 6              # bandas de s por cuantiles: ~6.600 px/banda, y la
                         # transferencia medida varía en ~1.5 km (M1: e-folding
                         # 1.2 km), así que 6 tramos la resuelven sin sobrar
sd_nivel_m: 0.13         # error de nivel por escena medido el 2026-08-18
                         # (hora real vs nominal); la puerta corre CON él
                         # porque el archivo real lo lleva puesto
seed: 20260819

# banco de series desplazadas: EOT20 evaluado en t_real - tau. El rango cubre
# el retardo maximo observado en Villaviciosa (+74 min rio arriba) con margen,
# y el paso de 15 min se interpola linealmente (la marea es suave a esa escala)
taus_banco_min: [-30, -15, 0, 15, 30, 45, 60, 75, 90, 105, 120]

# malla de busqueda de los estimadores de fase (M2b/c/d): paso 10 min porque
# la precision demostrada del metodo de rangos es ~4 min y el refinado
# parabolico baja del paso; de -20 a +100 cubre lo fisico con margen
tau_malla_min: {desde: -20.0, hasta: 100.0, paso: 10.0}

# M2a (Rasch/IRT) — v2 tras la puerta v1 ROJA (ver PHASE_LOG 2026-08-19):
# solo-fase (alpha=1) porque el teorema afin hace la ganancia por banda
# inidentificable en binario, y sigma PERFILADA por pixel sobre los atomos
# del archivo (con sigma fija, el desajuste de escala se filtraba a tau)
sigma0_m: 0.20           # solo como respaldo si no se perfila sigma
sigma_perfil_m: [0.06, 0.1, 0.15, 0.22, 0.32, 0.45]  # atomos del archivo
                         # (cuartiles interiores; 0.03 y 0.65 son colas)
z_puntos: 60             # malla de dificultades perfiladas: 60 puntos sobre
                         # el rango mareal ±0.3 m => paso ~8 cm < sigma0
alpha_limites: [0.7, 1.4]    # fisica estuarina: amortiguacion o resonancia
tau_limites_min: [-30.0, 120.0]

# submuestreo por banda, con semilla (R7): coste ~ lineal en pixeles y las
# curvas de fase/ganancia son propiedades de BANDA, no de pixel
max_px_banda: {m2a: 1200, m2b: 1500, m2d: 2500}
m2c_min_cobertura: 0.3   # una escena vota area si ve >=30 % de la banda
                         # (el filtro de las 512 escenas ya validado)

# ── verdad plantada en la puerta de identificabilidad ────────────────────────
plantado:
  alpha_boca_a_fondo: [1.0, 1.3]   # la spec: amplificacion 1.0 -> 1.3
  tau_boca_a_fondo_min: [0.0, 40.0] # y un retardo creciente realista
                                    # (lo medido llega a +74; 40 es conservador)

puerta:
  # v2 (pre-registrada en PHASE_LOG 2026-08-19 tras la v1 ROJA):
  # 1) FASE: el mejor estimador nuevo debe BATIR a M2d (Granadeiro) en RMSE
  #    contra el perfil plantado — sin cambios respecto a v1
  # 2) AMPLITUD: el criterio v1 (recuperar alpha con sesgo <3 % desde
  #    binario) contradice el teorema afin del propio proyecto: la
  #    verosimilitud es invariante bajo (alpha, z, sigma) -> (c*alpha, cz,
  #    c*sigma). La v2 exige EXPONER la degeneracion: el perfil NLL(alpha)
  #    con (z, sigma) perfilados debe ser plano
  max_recorrido_nll_alpha: 0.004   # ~0.5 % de la NLL tipica (0.87): una
                                   # curvatura mayor indicaria un canal no
                                   # afin sin explicar (a investigar, no a
                                   # celebrar)
  alpha_malla_perfil: [0.8, 0.9, 1.0, 1.1, 1.2, 1.3]

datos:
  store: data_v4/store/ndwi_intermareal.npz
  base: data_v4/store/lamina_base.npz
  mareas_hora_real: data_v4/store/mareas_hora_real.npz
  geometria: results/m1_geometry/geometry.npz
