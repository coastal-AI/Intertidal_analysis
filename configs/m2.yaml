# Phase M2 — interior-tide estimators. Nothing hardwired: every threshold
# with its rationale, so the method is explainable and citable (not a black
# box).

epoca_min: 2023          # the epoch with REAL overpass hour verified via
                         # STAC (11:21 UTC ± jitter); the cube only stores
                         # the date
n_bandas: 6              # quantile bands of s: ~6,600 px/band, and the
                         # measured transfer varies over ~1.5 km (M1:
                         # e-folding 1.2 km), so 6 segments resolve it
                         # without excess
sd_nivel_m: 0.13         # per-scene level error measured on 2026-08-18
                         # (real vs nominal hour); the gate runs WITH it
                         # because the real archive wears it
seed: 20260819

# bank of shifted series: EOT20 evaluated at t_real - tau. The range covers
# the maximum lag observed in Villaviciosa (+74 min upstream) with margin,
# and the 15-min step is interpolated linearly (the tide is smooth at that
# scale)
taus_banco_min: [-30, -15, 0, 15, 30, 45, 60, 75, 90, 105, 120]

# search grid of the phase estimators (M2b/c/d): 10-min step because the
# demonstrated precision of the rank method is ~4 min and the parabolic
# refinement goes below the step; -20 to +100 covers the physics with margin
tau_malla_min: {desde: -20.0, hasta: 100.0, paso: 10.0}

# M2a (Rasch/IRT) — v2 after the RED v1 gate (see PHASE_LOG 2026-08-19):
# phase-only (alpha=1) because the affine theorem makes per-band gain
# unidentifiable in binary, and sigma PROFILED per pixel over the archive's
# atoms (with fixed sigma, the scale mismatch leaked into tau)
sigma0_m: 0.20           # only as fallback when sigma is not profiled
sigma_perfil_m: [0.06, 0.1, 0.15, 0.22, 0.32, 0.45]  # archive atoms
                         # (interior quartiles; 0.03 and 0.65 are tails)
z_puntos: 60             # profiled-difficulty grid: 60 points over the
                         # tidal range ±0.3 m => ~8 cm step < sigma0
alpha_limites: [0.7, 1.4]    # estuarine physics: damping or resonance
tau_limites_min: [-30.0, 120.0]

# per-band subsampling, seeded (R7): cost ~ linear in pixels and the
# phase/gain curves are BAND properties, not pixel properties
max_px_banda: {m2a: 1200, m2b: 1500, m2d: 2500}
m2c_min_cobertura: 0.3   # a scene votes area if it sees >=30 % of the band
                         # (the already-validated 512-scene filter)

# ── truth planted in the identifiability gate ────────────────────────────────
plantado:
  alpha_boca_a_fondo: [1.0, 1.3]   # the spec: amplification 1.0 -> 1.3
  tau_boca_a_fondo_min: [0.0, 40.0] # and a realistic increasing lag
                                    # (measured reaches +74; 40 is
                                    # conservative)

puerta:
  # v2 (pre-registered in PHASE_LOG 2026-08-19 after the RED v1):
  # 1) PHASE: the best new estimator must BEAT M2d (Granadeiro) in RMSE
  #    against the planted profile — unchanged from v1
  # 2) AMPLITUDE: the v1 criterion (recover alpha with <3 % bias from
  #    binary) contradicts the project's own affine theorem: the
  #    likelihood is invariant under (alpha, z, sigma) -> (c*alpha, cz,
  #    c*sigma). v2 demands EXPOSING the degeneracy: the NLL(alpha)
  #    profile with (z, sigma) profiled must be flat
  max_recorrido_nll_alpha: 0.004   # ~0.5 % of the typical NLL (0.87): a
                                   # larger curvature would indicate an
                                   # unexplained non-affine channel (to
                                   # investigate, not to celebrate)
  alpha_malla_perfil: [0.8, 0.9, 1.0, 1.1, 1.2, 1.3]

datos:
  store: data_v4/store/ndwi_intermareal.npz
  base: data_v4/store/lamina_base.npz
  mareas_hora_real: data_v4/store/mareas_hora_real.npz
  geometria: results/m1_geometry/geometry.npz
